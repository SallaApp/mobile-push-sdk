name: Flutter CI

# The checks of the Flutter package, in flutter/, on GitHub-hosted runners: the Dart checks on both supported Flutter
# versions, the checks of the scripts, the pub.dev archive, and the native builds and unit tests on Linux and macOS.
# They resolve the native SallaPush SDKs from their public repositories and Maven Central. The example's smoke tests,
# the emulator run of its release build, the consumer install and the checks with Flutter 3.44 on macOS run locally,
# before each release (flutter/RELEASING.md). ci.yml calls this workflow for every pull request that changes flutter/
# or its workflows, flutter-publish.yml included, since the tree step checks its actions, and for every push to master.
# It can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Every job that checks out the repository runs in the package's folder.
defaults:
  run:
    shell: bash
    working-directory: flutter

jobs:
  dart:
    name: Dart (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.9', '3.47.7']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      # FLUTTER is unset here: scripts/common.sh takes flutter from PATH and dart next to it.
      - name: Analyze, unit tests and coverage
        run: scripts/verify.sh analyze test
      # The formatter, the generated code and the API dump depend on the Dart and analyzer versions, so they are
      # checked on the newest Flutter only.
      - name: Format, generated code, API surface, parity, README snippets, version pins and tree
        if: matrix.flutter == '3.47.7'
        run: scripts/verify.sh format pigeon api parity snippets pins tree

  # Every script: bash -n, shellcheck 0.11.0 from its pinned image, and the tooling's own tests.
  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n, shellcheck and the tooling self-test
        run: scripts/verify.sh shell

  # The pub.dev archive, as a release would upload it: pub's validation finds nothing to warn about, and .pubignore
  # keeps the repository's own tooling and docs out.
  pub:
    name: pub.dev package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: flutter pub publish --dry-run, and what the archive holds
        run: scripts/verify.sh pub

  # The plugin's Android unit tests and lint, and the example's release build, shrunk by R8, with its merged manifest.
  # The runner has no emulator, so the release build's 15-second run stays a local step (VERIFY_ANDROID_NO_EMULATOR).
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Unit tests, lint, the R8 release build and its merged manifest
        env:
          VERIFY_ANDROID_NO_EMULATOR: '1'
        run: scripts/verify.sh android

  # SwiftLint; the example and its extension with Swift Package Manager, and the plugin's XCTest suite on a simulator;
  # a fresh app in CocoaPods mode.
  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SWIFTLINT_VERSION: 0.63.2
      SWIFTLINT_BUNDLE_URL: https://github.com/realm/SwiftLint/releases/download/0.63.2/SwiftLintBinary.artifactbundle.zip
      # GitHub's digest of that release asset, which is also the binary-target checksum in SwiftLint's Package.swift at
      # tag 0.63.2, as the SallaPush iOS SDK pins it. Re-confirm it with:
      #   gh api repos/realm/SwiftLint/releases/tags/0.63.2 --jq '.assets[] | select(.name == "SwiftLintBinary.artifactbundle.zip") | .digest'
      SWIFTLINT_BUNDLE_SHA256: 12befab676fc972ffde2ec295d016d53c3a85f64aabd9c7fee0032d681e307e9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DEVELOPER_DIR instead of `sudo xcode-select`: no privilege needed, and every later step inherits it.
      - name: Select the newest Xcode 26
        run: |
          set -euo pipefail
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26.*.app' | grep -E '/Xcode_26\.[0-9]+(\.[0-9]+)?\.app$' | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            default_version="$(DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild -version 2>/dev/null || true)"
            case "$default_version" in "Xcode 26."*) xcode=/Applications/Xcode.app ;; esac
          fi
          [ -n "$xcode" ] || { echo "::error::no Xcode 26.x is installed on this runner"; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      # Mandatory and pinned: CI fails when the bundle is missing or its checksum differs.
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }} (pinned bundle)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o swiftlint.zip "$SWIFTLINT_BUNDLE_URL"
          echo "$SWIFTLINT_BUNDLE_SHA256  swiftlint.zip" | shasum -a 256 -c -
          rm -rf swiftlint && mkdir swiftlint && unzip -q swiftlint.zip -d swiftlint
          bundle="$(find "$PWD/swiftlint" -maxdepth 2 -name '*.artifactbundle' -type d | sed -n 1p)"
          [ -n "$bundle" ] || { echo "::error::the SwiftLint zip holds no .artifactbundle"; exit 1; }
          # The executable's path comes from the bundle's manifest. The helper is a file, not a heredoc inside $(...),
          # which macOS's bash 3.2 can mis-parse.
          cat > find-swiftlint.py <<'PY'
          import json, platform, sys
          bundle = sys.argv[1]
          triple = ("arm64" if platform.machine() == "arm64" else "x86_64") + "-apple-macosx"
          info = json.load(open(f"{bundle}/info.json"))
          for artifact in info["artifacts"].values():
              for variant in artifact.get("variants", []):
                  if artifact.get("type") == "executable" and triple in variant.get("supportedTriples", []):
                      print(f"{bundle}/{variant['path']}")
                      sys.exit(0)
          sys.exit(f"no {triple} swiftlint in {bundle}/info.json")
          PY
          binary="$(python3 find-swiftlint.py "$bundle")"
          [ "$("$binary" version)" = "$SWIFTLINT_VERSION" ] || { echo "::error::the bundle is not SwiftLint $SWIFTLINT_VERSION"; exit 1; }
          echo "SWIFTLINT=$binary" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: SwiftLint, the example and the plugin's XCTest suite, and CocoaPods mode
        run: scripts/verify.sh swiftlint ios ios-pods

  # It fails unless every job above succeeded or was skipped. ci.yml's Testing Ready, the check that a pull request
  # needs, fails with it.
  ready:
    name: Flutter ready
    if: always()
    needs: [dart, shell-scripts, pub, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # No checkout, so no flutter/ folder: the step runs in the empty workspace.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job above succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job this check needs ended with $result"; exit 1 ;;
            esac
          done
          echo "every job succeeded or was skipped: $RESULTS"
