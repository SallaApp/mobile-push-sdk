name: Capacitor Publish

# A release is a tag capacitor-<version> of a master commit, such as capacitor-1.1.0 or capacitor-1.2.0-beta.1. Its push
# checks the tag, runs the checks of the capacitor CI's js job and packs the package, with read access only. The next
# two jobs run in the protected environment "release" without a checkout, so no code of the package or of its
# dependencies runs where the credentials are: one publishes the packed file to npm with trusted publishing (OIDC, so no
# token is stored), and the other creates the GitHub Release capacitor-<version> from the version's
# CHANGELOG entry, with npm's package file attached, which apps can install from its URL. The package's first version is
# published by hand before its tag is pushed (capacitor/RELEASING.md): for a version npm has already, the run checks
# that npm's files are the tag's and publishes nothing.
on:
  push:
    tags: ['capacitor-[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: capacitor

jobs:
  check:
    name: Check the release tag and the package
    runs-on: ${{ fromJSON(vars.RUNS_ON) }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      file: ${{ steps.pack.outputs.file }}
    steps:
      # All history: the tagged commit must be on master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is capacitor-<version> of a master commit, at the version of its package.json and CHANGELOG
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#capacitor-}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::$TAG isn't capacitor-X.Y.Z or capacitor-X.Y.Z-<pre-release>"; exit 1; }
          git merge-base --is-ancestor HEAD origin/master ||
            { echo "::error::$TAG names a commit that isn't on master: tag a merged commit"; exit 1; }
          python3 - "$version" <<'PY'
          import json, sys

          version = sys.argv[1]
          with open("package.json", encoding="utf-8") as handle:
              package = json.load(handle)
          problems = []
          if package.get("version") != version:
              problems.append(f"package.json declares {package.get('version')}, not {version}")
          if package.get("private"):
              problems.append("package.json is private")
          if (package.get("publishConfig") or {}).get("access") != "public":
              problems.append("package.json doesn't publish with public access")
          with open("CHANGELOG.md", encoding="utf-8") as handle:
              headings = [line for line in handle if line.startswith(f"## [{version}]")]
          if len(headings) != 1:
              problems.append(f"CHANGELOG.md has {len(headings)} '## [{version}]' entries, not 1")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY
          # SemVer: a hyphen right after the patch number makes a pre-release, whatever its name.
          prerelease=false
          [[ "$version" != *-* ]] || prerelease=true
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          echo "$TAG names master's $(git rev-parse --short HEAD), and package.json and CHANGELOG name $version"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: capacitor/.nvmrc
      - name: Install
        run: |
          corepack enable
          yarn install --immutable
      - name: The checks of the capacitor CI's js job
        run: scripts/verify.sh lint typecheck test build pack api parity snippets pins tree
      # npm packs the folder as package.json's files list says, with dist/ as the pack step's prepack built it afresh;
      # without scripts, nothing runs but npm.
      - name: Pack the package the checks passed, with the version's CHANGELOG entry as the release notes
        id: pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/release" >"$RUNNER_TEMP/pack.json"
          file="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[0]["filename"].split("/")[-1])' \
            "$RUNNER_TEMP/pack.json")"
          [ -f "$RUNNER_TEMP/release/$file" ] || { echo "::error::npm pack made no $file"; exit 1; }
          python3 - "$VERSION" "$RUNNER_TEMP/release/notes.md" <<'PY'
          import sys

          version, notes = sys.argv[1], sys.argv[2]
          with open("CHANGELOG.md", encoding="utf-8") as handle:
              lines = handle.read().split("\n")
          start = next((index for index, line in enumerate(lines) if line.startswith(f"## [{version}]")), None)
          if start is None:
              print(f"::error::CHANGELOG.md has no '## [{version}]' entry for the release notes")
              sys.exit(1)
          end = next((index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")), len(lines))
          with open(notes, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines[start + 1:end]).strip() + "\n")
          PY
          echo "name=$(node -p 'require("./package.json").name')" >>"$GITHUB_OUTPUT"
          echo "file=$file" >>"$GITHUB_OUTPUT"
          echo "the package npm will publish: $file"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  # Trusted publishing: npm takes the workflow's OIDC token, and no npm token exists. No --provenance: npm makes
  # provenance only for a public repository and rejects a publish that asks for it from any other; once this repository
  # is public, trusted publishing adds provenance by itself.
  publish:
    name: Publish to npm
    needs: check
    # GitHub-hosted on purpose: npm trusted publishing doesn't accept self-hosted runners (the org runners count as
    # self-hosted), and this job never touches the repository, so the org IP allow list doesn't apply to it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    # No checkout and no install: the job publishes the packed file, which runs none of the package's scripts.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later, which trusted publishing needs
        run: |
          set -euo pipefail
          version="$(npm --version)"
          python3 -c 'import re, sys; v = tuple(int(p) for p in re.findall(r"\d+", sys.argv[1])[:3]); sys.exit(v < (11, 5, 1))' \
            "$version" || { echo "::error::npm $version can't publish with trusted publishing: it needs 11.5.1 or later"; exit 1; }
          echo "npm $version"
      # A pre-release goes to the next tag. A version npm already has, such as a package's first one, which a maintainer
      # publishes by hand, or a re-run, is not published again, and its files must be the packed file's.
      - name: Publish the packed package
        env:
          NAME: ${{ needs.check.outputs.name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          FILE: ${{ needs.check.outputs.file }}
        run: |
          set -euo pipefail
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            mkdir "$RUNNER_TEMP/npm" "$RUNNER_TEMP/tag"
            npm pack "$NAME@$VERSION" --pack-destination "$RUNNER_TEMP/npm" --loglevel warn >/dev/null
            tar -xzf "$RUNNER_TEMP"/npm/*.tgz -C "$RUNNER_TEMP/npm"
            tar -xzf "$RUNNER_TEMP/release/$FILE" -C "$RUNNER_TEMP/tag"
            diff -r "$RUNNER_TEMP/npm/package" "$RUNNER_TEMP/tag/package" ||
              { echo "::error::npm has $NAME@$VERSION with other files than the tag's"; exit 1; }
            echo "::notice::npm already has $NAME@$VERSION, with the tag's files: nothing to publish"
            exit 0
          fi
          dist_tag=latest
          [ "$PRERELEASE" != true ] || dist_tag=next
          npm publish "$RUNNER_TEMP/release/$FILE" --access public --tag "$dist_tag"

  github-release:
    name: GitHub Release
    needs: [check, publish]
    runs-on: ${{ fromJSON(vars.RUNS_ON) }}
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    # No checkout: the job works on the release notes of the packed release, and on npm's package file.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # npm's own file of the version, so that the GitHub Release holds the package that npm serves. npm may take a
      # moment to serve a version it has just taken.
      - name: Download the version's package file from npm
        id: package
        env:
          NAME: ${{ needs.check.outputs.name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/package"
          attempt=1
          until npm pack "$NAME@$VERSION" --pack-destination "$RUNNER_TEMP/package" --json >"$RUNNER_TEMP/pack.json" \
            2>"$RUNNER_TEMP/pack.log"; do
            [ "$attempt" -lt 10 ] || {
              cat "$RUNNER_TEMP/pack.log"
              echo "::error::npm doesn't serve $NAME@$VERSION"
              exit 1
            }
            attempt=$((attempt + 1))
            sleep 30
          done
          file="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[0]["filename"].split("/")[-1])' \
            "$RUNNER_TEMP/pack.json")"
          [ -f "$RUNNER_TEMP/package/$file" ] || { echo "::error::npm pack made no $file"; exit 1; }
          echo "file=$RUNNER_TEMP/package/$file" >>"$GITHUB_OUTPUT"
          echo "$NAME@$VERSION from npm: $file"
      - name: Create the GitHub Release from the version's CHANGELOG entry, with the package file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: |
          set -euo pipefail
          args=(release create "$TAG" "$PACKAGE_FILE" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"
            --notes-file "$RUNNER_TEMP/release/notes.md")
          [ "$PRERELEASE" != true ] || args+=(--prerelease)
          gh "${args[@]}"
