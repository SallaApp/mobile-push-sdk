name: React Native Publish

# A release tag, react-native-<version> on a commit of master, publishes react-native/ to npm. The first job, with read
# access only, checks the tag against package.json and the CHANGELOG, runs the checks and packs the package. The next
# two run in the protected environment "release" on the packed .tgz alone, so no code of the package or of its
# dependencies runs where the credentials are: one publishes the .tgz to npm with trusted publishing (OIDC, so no token
# is stored), and the other creates the GitHub Release react-native-<version> from the version's
# CHANGELOG entry, with the .tgz attached. The package's first version is published by hand before its tag is pushed
# (react-native/RELEASING.md): for a version npm has already, the run checks that npm's files are the tag's and
# publishes nothing.
on:
  push:
    tags: ['react-native-[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: react-native

jobs:
  package:
    name: Check and pack the package
    runs-on: ${{ fromJSON(vars.RUNS_ON) }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # All history: the tagged commit must be on master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a commit of master, at the version of package.json and the CHANGELOG
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/master ||
            { echo "::error::the tag $TAG isn't on master: tag a commit of master"; exit 1; }
          version="${TAG#react-native-}"
          mkdir "$RUNNER_TEMP/release"
          # The version's CHANGELOG entry becomes the GitHub Release's notes.
          python3 - "$version" "$RUNNER_TEMP/release/notes.md" <<'PY'
          import json, sys
          version, notes = sys.argv[1:3]
          problems = []
          with open("package.json", encoding="utf-8") as handle:
              declared = json.load(handle).get("version")
          if declared != version:
              problems.append(f"package.json declares {declared}, not the tag's {version}")
          with open("CHANGELOG.md", encoding="utf-8") as handle:
              lines = handle.read().split("\n")
          starts = [index for index, line in enumerate(lines) if line.startswith(f"## [{version}]")]
          if len(starts) != 1:
              problems.append(f"CHANGELOG.md needs exactly one '## [{version}]' entry, not {len(starts)}")
          else:
              later = [index for index, line in enumerate(lines) if index > starts[0] and line.startswith("## ")]
              with open(notes, "w", encoding="utf-8") as handle:
                  handle.write("\n".join(lines[starts[0] + 1 : later[0] if later else len(lines)]).strip() + "\n")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY
          echo "name=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["name"])')" \
            >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: react-native/.nvmrc
      - name: Install
        run: |
          corepack enable
          yarn install --immutable
      # The pack step builds the package afresh and checks what npm would publish.
      - name: Lint, types, unit tests, checker self-tests, build, npm package, API surface, parity, README snippets, version pins and tree
        run: scripts/verify.sh lint typecheck test build pack api parity snippets pins tree
      - name: Pack the package the checks passed
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/release" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["filename"])')"
          [ -f "$RUNNER_TEMP/release/$tarball" ] || { echo "::error::npm pack made no $tarball"; exit 1; }
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: package
    # GitHub-hosted on purpose: npm trusted publishing doesn't accept self-hosted runners (the org runners count as
    # self-hosted), and this job never touches the repository, so the org IP allow list doesn't apply to it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    # No checkout: the job works on the packed release only.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check whether npm has this version already
        id: registry
        env:
          NAME: ${{ needs.package.outputs.name }}
          VERSION: ${{ needs.package.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          set -euo pipefail
          # npm view prints the version only when npm has it; a missing package or version is an E404.
          published="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
          if [ "$published" != "$VERSION" ]; then
            echo "published=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/npm" "$RUNNER_TEMP/tag"
          npm pack "$NAME@$VERSION" --pack-destination "$RUNNER_TEMP/npm" --loglevel warn >/dev/null
          tar -xzf "$RUNNER_TEMP"/npm/*.tgz -C "$RUNNER_TEMP/npm"
          tar -xzf "$RUNNER_TEMP/release/$TARBALL" -C "$RUNNER_TEMP/tag"
          diff -r "$RUNNER_TEMP/npm/package" "$RUNNER_TEMP/tag/package" ||
            { echo "::error::npm has $NAME@$VERSION with other files than the tag's"; exit 1; }
          echo "npm has $NAME@$VERSION already, with the tag's files: nothing to publish"
          echo "published=true" >>"$GITHUB_OUTPUT"
      - name: Publish with trusted publishing
        if: steps.registry.outputs.published != 'true'
        env:
          VERSION: ${{ needs.package.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          python3 -c 'import sys; sys.exit(tuple(map(int, sys.argv[1].split(".")[:3])) < (11, 5, 1))' "$npm_version" ||
            { echo "::error::npm $npm_version: trusted publishing needs npm 11.5.1 or later"; exit 1; }
          # A pre-release never becomes "latest". A tarball runs none of the package's scripts.
          dist_tag=()
          case "$VERSION" in *-*) dist_tag=(--tag next) ;; esac
          npm publish "$RUNNER_TEMP/release/$TARBALL" --access public ${dist_tag[@]+"${dist_tag[@]}"}

  github-release:
    name: GitHub Release
    needs: [package, npm]
    runs-on: ${{ fromJSON(vars.RUNS_ON) }}
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    # No checkout: the job works on the packed release only.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Create the GitHub Release from the version's CHANGELOG entry, with the package attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "$RUNNER_TEMP/release/$TARBALL" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/release/notes.md" ${prerelease[@]+"${prerelease[@]}"}
