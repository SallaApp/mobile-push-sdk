name: Bug report
description: Something in the SDK doesn't work as its docs say.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never paste tokens, keys or customer data here: the SallaPush log codes are enough.
        Security problems don't belong in an issue: report them privately, as this repository's security policy (the Security tab) explains.
        Contact the Salla team for your app id.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: The SallaPush SDK that has the problem.
      options:
        - Flutter
        - React Native
        - Capacitor
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: The SallaPush SDK version you use, such as 1.1.0.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      description: Such as iOS 18.6 on an iPhone 15, or Android 15 on a Pixel 8.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How your app sets up SallaPush
      description: The line of your package. For Flutter and Capacitor, how your app's iOS project gets SallaPush.
      options:
        - "Flutter: Swift Package Manager (Flutter's default)"
        - "Flutter: CocoaPods mode (enable-swift-package-manager set to false)"
        - "Flutter: The problem is on Android only"
        - "React Native: Expo, with the config plugin"
        - "React Native: Bare React Native, with the Podfile and Gradle set up by hand"
        - "React Native: Other"
        - "Capacitor: Swift Package Manager (ios/App/CapApp-SPM)"
        - "Capacitor: CocoaPods (ios/App/Podfile)"
        - "Capacitor: The problem is on Android only"
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Tools and frameworks
      description: Your Flutter, React Native and Expo, or Capacitor version; your Xcode and Android Gradle plugin versions; for React Native and Capacitor, your Node version and npm or Yarn; whether you installed the package from pub.dev, npm, git or a GitHub Release's package file; and the other push SDKs or plugins in your app.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps that show the problem. A small sample project helps most.
  - type: textarea
    id: log-codes
    attributes:
      label: SallaPush log codes
      description: Set the SallaPush log level to verbose, reproduce the problem, and paste the SallaPush lines, such as register.ok or login.rejected. Remove ids and tokens first.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this problem isn't reported yet.
          required: true
        - label: This report holds no tokens, keys or customer data.
          required: true
