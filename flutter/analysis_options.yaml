include: package:flutter_lints/flutter.yaml
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/src/messages.g.dart
    - build/**
    - android/**
    - ios/**
linter:
  rules:
    - public_member_api_docs
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
    - directives_ordering
