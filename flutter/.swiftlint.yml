# SwiftLint 0.63.2. Run from the flutter/ folder: swiftlint lint --strict --config .swiftlint.yml (scripts/verify.sh
# swiftlint). The rules are the native SallaPush iOS SDK's: the crash-safety rules are errors, and custom_rules ban the
# patterns that can trap or take over the app, which the plugin never does, and the required-reason APIs, which its
# privacy manifest declares none of.

included:
  - ios/mobile_push/Package.swift
  - ios/mobile_push/Sources
  - example/ios/Runner
  - example/ios/RunnerTests
  - example/ios/SallaPushNotificationService

excluded:
  # Generated by Pigeon (scripts/generate-pigeon.sh) and by Flutter.
  - ios/mobile_push/Sources/mobile_push/Messages.g.swift
  - example/ios/Runner/GeneratedPluginRegistrant.h
  - example/ios/Runner/GeneratedPluginRegistrant.m

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

disabled_rules:
  # Multi-line literals end with a comma.
  - trailing_comma

line_length:
  warning: 140
  error: 200
cyclomatic_complexity:
  ignores_case_statements: true
file_length:
  warning: 600
  error: 800
type_body_length:
  warning: 400
  error: 500
function_body_length:
  warning: 80
  error: 120
nesting:
  type_level: 2

force_unwrapping:
  severity: error
force_try:
  severity: error
force_cast:
  severity: error
implicitly_unwrapped_optional:
  severity: error

custom_rules:
  no_trap:
    name: "No traps"
    regex: '\b(fatalError|precondition|preconditionFailure|assert|assertionFailure|dispatchPrecondition)\s*\('
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "The plugin never traps, as SallaPush never does: log and fall back."
    severity: error
  no_unowned:
    name: "No unowned"
    regex: '\bunowned\b'
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Use weak references; unowned can trap."
    severity: error
  no_unchecked_dictionary_init:
    name: "No Dictionary(uniqueKeysWithValues:)"
    regex: 'Dictionary\s*\(\s*uniqueKeysWithValues\s*:'
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Traps on duplicate keys; build the dictionary with a loop."
    severity: error
  no_string_format:
    name: "No String(format:)"
    regex: 'String\s*\(\s*format\s*:'
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Format specifiers can crash on bad input."
    severity: error
  no_json_serialization_writing:
    name: "No JSONSerialization writing"
    regex: 'JSONSerialization\s*\.\s*data\s*\(\s*withJSONObject'
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Throws an Objective-C exception on invalid input."
    severity: error
  no_main_sync:
    name: "No DispatchQueue.main.sync"
    regex: 'DispatchQueue\s*\.\s*main\s*\.\s*sync\b'
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Can deadlock; hop to main asynchronously."
    severity: error
  no_bundle_module:
    name: "No Bundle.module"
    regex: '\bBundle\s*\.\s*module\b'
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "The generated accessor traps when the resource bundle is missing."
    severity: error
  no_process_hooks:
    name: "No swizzling or KVO"
    regex: '\b(method_exchangeImplementations|method_setImplementation|class_replaceMethod|class_addMethod|forKeyPath)\b'
    included: '/Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, string]
    message: "No swizzling and no KVO: apps call SallaPushFlutter.start() and forward to SallaPush."
    severity: error
  # SallaPush's own required-reason gate (scripts/check-gates.sh of the iOS SDK), comments included.
  no_required_reason_api:
    name: "No required-reason APIs"
    regex: '\b(systemUptime|mach_absolute_time|CACurrentMediaTime|getattrlist|creationDate|modificationDate|contentModificationDateKey|creationDateKey|fileModificationDate|UserDefaults|volumeAvailableCapacity)|\b(stat|lstat|fstat)\('
    included: '/Sources/.*\.swift$'
    message: "Backs PrivacyInfo.xcprivacy's empty NSPrivacyAccessedAPITypes, as SallaPush's own gate does."
    severity: error
