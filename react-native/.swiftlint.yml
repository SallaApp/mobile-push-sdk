# SwiftLint 0.63.2, run from the react-native folder by scripts/verify.sh swiftlint: swiftlint lint --strict

included:
  - ios
  - example/ios

excluded:
  - example/ios/Pods
  - example/ios/build

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

disabled_rules:
  - trailing_comma

force_cast: error
force_unwrapping: error
implicitly_unwrapped_optional: error

line_length:
  warning: 140
  error: 200
